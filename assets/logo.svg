<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- ikon kısmı -->
  <g transform="translate(20,20)">
    <rect width="160" height="160" rx="36" fill="url(#bg2)"/>
    <circle cx="80" cy="80" r="52" fill="none"
            stroke="rgba(255,255,255,0.18)" stroke-width="8"/>
    <circle cx="80" cy="80" r="52" fill="none"
            stroke="white" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="245 327"
            transform="rotate(-90 80 80)"/>
    <path d="M 44 58 L 60 105 L 80 73 L 100 105 L 116 58"
          fill="none" stroke="white" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- yazı: Win + OTP (vurgulu) -->
  <text x="210" y="128" font-family="Segoe UI, Arial, sans-serif"
        font-size="86" font-weight="700" fill="#0F172A">
    Win<tspan fill="#0EA5E9">OTP</tspan>
  </text>
</svg>
