<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- arka plan: yuvarlak köşeli kare -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- dış halka (TOTP geri sayım track'i) -->
  <circle cx="128" cy="128" r="84" fill="none"
          stroke="rgba(255,255,255,0.18)" stroke-width="12"/>

  <!-- ilerleme yayı (~%75) -->
  <circle cx="128" cy="128" r="84" fill="none"
          stroke="white" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="395 528"
          transform="rotate(-90 128 128)"/>

  <!-- ortadaki "W" işareti -->
  <path d="M 70 92 L 95 168 L 128 116 L 161 168 L 186 92"
        fill="none" stroke="white" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
